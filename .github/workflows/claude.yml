name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # General @claude assistant. Comments containing "@claude investigate" go to the
  # investigator jobs below instead.
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude investigate')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude investigate')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude investigate')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && !contains(github.event.issue.body, '@claude investigate') && !contains(github.event.issue.title, '@claude investigate'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

  # "@claude investigate [run-id]": read the run ID (optional) and, on a PR, its branch.
  # Only the owner, members and collaborators can start it (it costs Claude usage).
  parse:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude investigate')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude investigate')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude investigate')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude investigate') || contains(github.event.issue.title, '@claude investigate')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_id: ${{ steps.parse.outputs.run_id }}
      branch: ${{ steps.parse.outputs.branch }}
    steps:
      - id: parse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          run_id=$(printf '%s' "$BODY" | grep -oE '@claude investigate[[:space:]]+(run[[:space:]]+)?[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)
          branch="$PR_BRANCH"
          if [ -z "$branch" ] && [ "$ISSUE_IS_PR" = "true" ]; then
            branch=$(gh pr view "$ISSUE_NUMBER" --json headRefName --jq .headRefName || true)
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Run ID: ${run_id:-latest failed}  Branch: ${branch:-main}"

  investigate:
    needs: parse
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/investigate-ci.yml
    secrets: inherit
    with:
      run_id: ${{ needs.parse.outputs.run_id }}
      branch: ${{ needs.parse.outputs.branch }}
      same_run: false
