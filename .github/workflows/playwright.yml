name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30

  # When the tests fail, Claude investigates and uploads a ci-failure-report artifact
  # to this run. Flaky-only runs pass, so they never get here. Forks get no secrets: skip.
  investigate:
    needs: test
    if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/investigate-ci.yml
    secrets: inherit
    with:
      run_id: ${{ github.run_id }}
      same_run: true
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      head_branch: ${{ github.head_ref || github.ref_name }}
      base_ref: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
