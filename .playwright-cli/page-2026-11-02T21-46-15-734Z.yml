            - /url: https://practicetestautomation.com/beginners-course-coupon
          - text: .
        - heading "Create list of your favorite foods" [level=5] [ref=f3e36]
        - paragraph [ref=f3e37]: Push “Add” button to add another row
        - generic [ref=f3e38]:
          - generic [ref=f3e40]:
            - text: Row 1
            - textbox [disabled] [ref=f3e41]: Pizza
            - button "Edit" [ref=f3e42] [cursor=pointer]
            - button "Add" [ref=f3e43] [cursor=pointer]
          - generic [ref=f3e44]: Row 2 was added
        - separator [ref=f3e45]
        - 'heading "Test case 1: NoSuchElementException" [level=5] [ref=f3e46]'
        - list [ref=f3e47]:
          - listitem [ref=f3e48]: Open page
          - listitem [ref=f3e49]: Click Add button
          - listitem [ref=f3e50]: Verify Row 2 input field is displayed
        - paragraph [ref=f3e51]: Row 2 doesn’t appear immediately. This test will fail with org.openqa.selenium.NoSuchElementException without proper wait
        - separator [ref=f3e52]
        - 'heading "Test case 2: ElementNotInteractableException" [level=5] [ref=f3e53]'
        - list [ref=f3e54]:
          - listitem [ref=f3e55]: Open page
          - listitem [ref=f3e56]: Click Add button
          - listitem [ref=f3e57]: Wait for the second row to load
          - listitem [ref=f3e58]: Type text into the second input field
          - listitem [ref=f3e59]: Push Save button using locator By.name(“Save”)
          - listitem [ref=f3e60]: Verify text saved
        - paragraph [ref=f3e61]: This page contains two elements with attribute name=”Save”.The first one is invisible. So when we are trying to click on the invisible element, we get ElementNotInteractableException.
        - paragraph [ref=f3e62]: The same action used to throw ElementNotVisibleException, but now it throws a different exception (not sure if it’s a bug in Selenium or a feature)
        - separator [ref=f3e63]
        - 'heading "Test case 3: InvalidElementStateException" [level=5] [ref=f3e64]'
        - list [ref=f3e65]:
          - listitem [ref=f3e66]: Open page
          - listitem [ref=f3e67]: Clear input field
          - listitem [ref=f3e68]: Type text into the input field
          - listitem [ref=f3e69]: Verify text changed
        - paragraph [ref=f3e70]: The input field is disabled. Trying to clear the disabled field will throw InvalidElementStateException. We need to enable editing of the input field first by clicking the Edit button.
        - paragraph [ref=f3e71]: If we try to type text into the disabled input field, we will get ElementNotInteractableException, as in Test case 2.
        - separator [ref=f3e72]
        - 'heading "Test case 4: StaleElementReferenceException" [level=5] [ref=f3e73]'
        - list [ref=f3e74]:
          - listitem [ref=f3e75]: Open page
          - listitem [ref=f3e76]: Find the instructions text element
          - listitem [ref=f3e77]: Push add button
          - listitem [ref=f3e78]: Verify instruction text element is no longer displayed
        - paragraph [ref=f3e79]: The instructions element is removed from the page when the second row is added. That’s why we can no longer interact with it. Otherwise, we will see StaleElementReferenceException.
        - separator [ref=f3e80]
        - 'heading "Test case 5: TimeoutException" [level=5] [ref=f3e81]'
        - list [ref=f3e82]:
          - listitem [ref=f3e83]: Open page
          - listitem [ref=f3e84]: Click Add button
          - listitem [ref=f3e85]: Wait for 3 seconds for the second input field to be displayed
          - listitem [ref=f3e86]: Verify second input field is displayed
        - paragraph [ref=f3e87]: The second row shows up after about 5 seconds, so a 3-second timeout is not enough. That’s why we will get TimeoutException while executing steps in the above test case.
