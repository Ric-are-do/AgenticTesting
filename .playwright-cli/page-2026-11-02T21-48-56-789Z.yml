        - heading "Test Exceptions" [level=2] [ref=f1e33]
        - paragraph [ref=f1e34]:
          - text: "This page is created to be able to reproduce the most common Selenium Exceptions. Follow test cases below to see exactly how to get: ElementNotInteractableException, ElementNotVisibleException, NoSuchElementException and StaleElementReferenceException. If you want to learn how to deal with these exceptions in your tests, check out my"
          - link "Selenium WebDriver with Java for beginners program" [ref=f1e35] [cursor=pointer]:
            - /url: https://practicetestautomation.com/beginners-course-coupon
          - text: .
        - heading "Create list of your favorite foods" [level=5] [ref=f1e36]
        - generic [ref=f1e38]:
          - generic [ref=f1e40]:
            - text: Row 1
            - textbox [disabled] [ref=f1e41]: Pizza
          - generic [ref=f1e92]: Loading…
          - generic [ref=f1e44]: Row 2 was added
        - separator [ref=f1e45]
        - 'heading "Test case 1: NoSuchElementException" [level=5] [ref=f1e46]'
        - list [ref=f1e47]:
          - listitem [ref=f1e48]: Open page
          - listitem [ref=f1e49]: Click Add button
          - listitem [ref=f1e50]: Verify Row 2 input field is displayed
        - paragraph [ref=f1e51]: Row 2 doesn’t appear immediately. This test will fail with org.openqa.selenium.NoSuchElementException without proper wait
        - separator [ref=f1e52]
        - 'heading "Test case 2: ElementNotInteractableException" [level=5] [ref=f1e53]'
        - list [ref=f1e54]:
          - listitem [ref=f1e55]: Open page
          - listitem [ref=f1e56]: Click Add button
          - listitem [ref=f1e57]: Wait for the second row to load
          - listitem [ref=f1e58]: Type text into the second input field
          - listitem [ref=f1e59]: Push Save button using locator By.name(“Save”)
          - listitem [ref=f1e60]: Verify text saved
        - paragraph [ref=f1e61]: This page contains two elements with attribute name=”Save”.The first one is invisible. So when we are trying to click on the invisible element, we get ElementNotInteractableException.
        - paragraph [ref=f1e62]: The same action used to throw ElementNotVisibleException, but now it throws a different exception (not sure if it’s a bug in Selenium or a feature)
        - separator [ref=f1e63]
        - 'heading "Test case 3: InvalidElementStateException" [level=5] [ref=f1e64]'
        - list [ref=f1e65]:
          - listitem [ref=f1e66]: Open page
          - listitem [ref=f1e67]: Clear input field
          - listitem [ref=f1e68]: Type text into the input field
          - listitem [ref=f1e69]: Verify text changed
        - paragraph [ref=f1e70]: The input field is disabled. Trying to clear the disabled field will throw InvalidElementStateException. We need to enable editing of the input field first by clicking the Edit button.
        - paragraph [ref=f1e71]: If we try to type text into the disabled input field, we will get ElementNotInteractableException, as in Test case 2.
        - separator [ref=f1e72]
        - 'heading "Test case 4: StaleElementReferenceException" [level=5] [ref=f1e73]'
        - list [ref=f1e74]:
          - listitem [ref=f1e75]: Open page
          - listitem [ref=f1e76]: Find the instructions text element
          - listitem [ref=f1e77]: Push add button
          - listitem [ref=f1e78]: Verify instruction text element is no longer displayed
        - paragraph [ref=f1e79]: The instructions element is removed from the page when the second row is added. That’s why we can no longer interact with it. Otherwise, we will see StaleElementReferenceException.
        - separator [ref=f1e80]
        - 'heading "Test case 5: TimeoutException" [level=5] [ref=f1e81]'
        - list [ref=f1e82]:
          - listitem [ref=f1e83]: Open page
          - listitem [ref=f1e84]: Click Add button
          - listitem [ref=f1e85]: Wait for 3 seconds for the second input field to be displayed
          - listitem [ref=f1e86]: Verify second input field is displayed
        - paragraph [ref=f1e87]: The second row shows up after about 5 seconds, so a 3-second timeout is not enough. That’s why we will get TimeoutException while executing steps in the above test case.
