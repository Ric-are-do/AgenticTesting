            - img "Dmitry Shyshkin, your Selenium WebDriver instructor" [ref=f1e40]
          - paragraph [ref=f1e41]:
            - strong [ref=f1e42]: Welcome to Practice Test Automation!
          - paragraph [ref=f1e43]: I’m Dmitry Shyshkin, your guide on the path to a thriving QA career. Effortlessly master Selenium WebDriver and test automation to enhance your skills and increase your earnings.
          - paragraph [ref=f1e44]:
            - strong [ref=f1e45]: Experience and Expertise
          - paragraph [ref=f1e46]: As a Principal Software Development Engineer in Test, I bring over a decade of experience in automating Web UI, API, and Mobile tests using tools like Selenium WebDriver, Appium, Postman, RestAssured, and more. I began my journey as a manual QA engineer and quickly developed a passion for test automation. Having served as the lead test automation expert in various projects, I’m confident in my ability to help you excel in test automation.
          - paragraph [ref=f1e47]:
            - strong [ref=f1e48]: Beyond Test Automation
          - paragraph [ref=f1e49]: Not only have I automated tests, but I’ve also applied automation to job searches and even finding cheaper flights! Now, I’m eager to share this passion and knowledge with you.
          - paragraph [ref=f1e50]:
            - strong [ref=f1e51]: Courses and Achievements
          - paragraph [ref=f1e52]:
            - text: In 2017, I started sharing my test automation expertise through video courses, beginning with a Selenium WebDriver tutorial on YouTube. Today, I offer
            - link "nine courses with over 100,000 students" [ref=f1e53] [cursor=pointer]:
              - /url: https://practicetestautomation.com/courses/
            - text: ", including a"
            - strong [ref=f1e54]:
              - link "BestSeller XPath course" [ref=f1e55] [cursor=pointer]:
                - /url: https://www.udemy.com/course/xpath-locators-for-selenium/?referralCode=ACB28329B5AC2333DDCC
            - text: and a
            - strong [ref=f1e56]:
              - link "HighestRated Selenium course" [ref=f1e57] [cursor=pointer]:
                - /url: https://www.udemy.com/course/selenium-for-beginners/?referralCode=A21BE51035C15406EFA4
            - text: . With a 4.7 out of 5 instructor rating, I’m grateful to every student who has joined me on this journey.
          - paragraph [ref=f1e58]:
            - strong [ref=f1e59]: A Resourceful Website
          - paragraph [ref=f1e60]:
            - text: This website was carefully crafted to host a
            - strong [ref=f1e61]:
